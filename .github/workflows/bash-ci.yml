name: Bash CI Workflow

on: 
  push:
    branches: ["main"]
    paths:
      - '**.sh'

permissions:
  contents: read

jobs:
  bash-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -r shellcheck
